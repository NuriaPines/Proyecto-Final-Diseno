<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/_generic.css" />
    <link rel="stylesheet" href="css/_card.css" />
    <title>REBAJAS</title>
  </head>
  <body>
    <script src="js/carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <nav class="navbar navbar-expand-sm bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"
          ><span class="display-1 fs-2">WEREABLE</span></a
        >
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto d-flex align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="catalog.html">Catálogo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="sales.html"
                ><button class="btn btn-outline-danger btn-sm">
                  Rebajas
                </button></a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="carrito.html">Carrito</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row g-5">
        <div class="col-lg-8">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h2 class="mb-0">Tu Selección</h2>
            <span class="btn-vaciar" onclick="vaciarCarrito()"
              >Eliminar todo</span
            >
          </div>
          <div id="lista-carrito"></div>
        </div>

        <div class="col-lg-4">
          <div class="card summary-card p-4 shadow-sm">
            <h4 class="price mb-4">Resumen</h4>
            <div class="d-flex justify-content-between mb-2"></div>
            <div class="d-flex justify-content-between mb-2">
              <span>Envío</span>
              <span class="text-success">Gratis</span>
            </div>
            <hr />
            <div class="d-flex justify-content-between mb-4">
              <span class="fw-bold">Total</span>
              <span id="total" class="price fs-3">0.00€</span>
            </div>
            <button
              class="btn btn-dark w-100 py-3 rounded-pill"
              data-bs-toggle="modal"
              data-bs-target="#loginModal"
            >
              Tramitar Pedido
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content border-0 shadow-lg"
          style="border-radius: 20px"
        >
          <div class="modal-header border-0 pb-0">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-5 pt-0">
            <h2 class="text-center mb-4 mt-0">Identifícate</h2>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label small fw-bold">Email</label>
                <input
                  type="email"
                  class="form-control rounded-pill py-2"
                  placeholder="tu@email.com"
                  required
                />
              </div>
              <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <input
                  type="password"
                  class="form-control rounded-pill py-2"
                  placeholder="••••••••"
                  required
                />
              </div>
              <button
                type="submit"
                class="btn btn-dark w-100 py-3 rounded-pill mb-3"
              >
                Iniciar Sesión
              </button>
              <div class="text-center">
                <span class="small text-muted"
                  >¿No tienes cuenta?
                  <a href="#" class="text-dark fw-bold">Regístrate</a></span
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
